# Builds the x86-64 Windows toolchain MaiCord uses (clang-cl, lld-link and
# llvm-lib with clang's core, x86 and Windows resource headers) from this fork
# with clang-cl from an earlier release of it: ThinLTO, rpmalloc, /GS-, static
# MSVC runtime. A toolchain-* tag push publishes it as a GitHub release; a
# manual run uploads it as a workflow artifact instead.
name: Windows toolchain release

on:
  push:
    tags:
      - 'toolchain-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-toolchain-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'maj113/llvm-pe'
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: write # gh release create
    env:
      ASSET: llvm-pe-x86_64-windows.zip
      # The host compiler: this release of the fork, not the runner's LLVM.
      BOOTSTRAP_TAG: toolchain-2026.10.28.2
      BOOTSTRAP_SHA256: 5c88e1e44764e3ff5a38d0bbff5538a5ac60896ec1476baf591e57c008e9ecd9
    steps:
      - name: Validate tag
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^toolchain-[0-9A-Za-z._-]+$') {
            throw "Release tag '$env:GITHUB_REF_NAME' must look like toolchain-YYYY.MM.DD."
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            cmake
            clang
            compiler-rt
            libc
            lld
            llvm
            third-party

      - name: Enter the MSVC x64 developer environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'No Visual Studio installation with the x64 C++ tools.' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $lines = & cmd.exe /d /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed with exit code $LASTEXITCODE." }
          foreach ($line in $lines) {
            $name, $value = $line -split '=', 2
            if ($value -and $name -notmatch '^(GITHUB_|RUNNER_)') {
              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      # The extracted bootstrap toolchain is cached under its tag and SHA-256, so a new pin
      # misses and fetches its own.
      - name: Restore the bootstrap toolchain
        id: bootstrap
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bootstrap
          key: llvm-pe-bootstrap-${{ env.BOOTSTRAP_TAG }}-${{ env.BOOTSTRAP_SHA256 }}

      - name: Fetch the bootstrap toolchain
        if: steps.bootstrap.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'bootstrap-download'
          gh release download $env:BOOTSTRAP_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:ASSET --dir $download
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed with exit code $LASTEXITCODE." }
          $archive = Join-Path $download $env:ASSET
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($hash -ne $env:BOOTSTRAP_SHA256.ToUpperInvariant()) {
            throw "$env:ASSET from $env:BOOTSTRAP_TAG hashes to $hash, not $env:BOOTSTRAP_SHA256."
          }
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'bootstrap')

      - name: Cache the bootstrap toolchain
        if: steps.bootstrap.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bootstrap
          key: llvm-pe-bootstrap-${{ env.BOOTSTRAP_TAG }}-${{ env.BOOTSTRAP_SHA256 }}

      - name: Configure
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'bootstrap\bin'
          & (Join-Path $bin 'clang-cl.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'The bootstrap clang-cl does not run.' }
          $options = @(
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded',
            "-DCMAKE_C_COMPILER=$(Join-Path $bin 'clang-cl.exe')",
            "-DCMAKE_CXX_COMPILER=$(Join-Path $bin 'clang-cl.exe')",
            "-DCMAKE_LINKER=$(Join-Path $bin 'lld-link.exe')",
            "-DCMAKE_AR=$(Join-Path $bin 'llvm-lib.exe')",
            # Visual Studio's mt, not an llvm-mt the runner image may have on PATH.
            "-DCMAKE_MT=$((Get-Command mt.exe).Source)",
            '-DLLVM_ENABLE_LTO=Thin',
            # Two concurrent LTO links of clang and lld need more memory than a runner has.
            '-DLLVM_PARALLEL_LINK_JOBS=2',
            '-DLLVM_ENABLE_RPMALLOC=ON',
            '-DLLVM_ENABLE_PROJECTS=clang;lld',
            '-DLLVM_TARGETS_TO_BUILD=X86',
            '-DLLVM_ENABLE_ASSERTIONS=OFF',
            '-DLLVM_INCLUDE_TESTS=OFF',
            '-DLLVM_INCLUDE_BENCHMARKS=OFF',
            '-DLLVM_INCLUDE_EXAMPLES=OFF',
            '-DLLVM_INCLUDE_DOCS=OFF',
            '-DCLANG_INCLUDE_TESTS=OFF',
            '-DCLANG_INCLUDE_DOCS=OFF',
            '-DCLANG_ENABLE_CIR=OFF',
            '-DCLANG_ENABLE_STATIC_ANALYZER=OFF',
            '-DCLANG_ENABLE_OBJC_REWRITER=OFF',
            '-DLLD_ENABLE_ELF=OFF',
            '-DLLD_ENABLE_MACHO=OFF',
            '-DLLD_ENABLE_MINGW=OFF',
            '-DLLD_ENABLE_WASM=OFF',
            '-DLLVM_ENABLE_DIA_SDK=OFF',
            '-DLLVM_ENABLE_LIBXML2=OFF',
            '-DLLVM_ENABLE_ZLIB=OFF',
            '-DLLVM_ENABLE_ZSTD=OFF')
          # No stack buffer security cookies: CMake prepends CFLAGS/CXXFLAGS to the flags every
          # compile uses, and stack protection is a per-function attribute in the bitcode, so the
          # ThinLTO links follow it too.
          $env:CFLAGS = '/GS-'
          $env:CXXFLAGS = '/GS-'
          cmake -G Ninja -S llvm -B build @options
          if ($LASTEXITCODE -ne 0) { throw "cmake failed with exit code $LASTEXITCODE." }

      - name: Build
        shell: pwsh
        run: |
          ninja -C build clang lld llvm-ar
          if ($LASTEXITCODE -ne 0) { throw "ninja failed with exit code $LASTEXITCODE." }

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:GITHUB_WORKSPACE 'build'
          $stage = Join-Path $env:RUNNER_TEMP 'llvm-pe'
          $bin = New-Item -ItemType Directory -Force -Path (Join-Path $stage 'bin')
          # Only what MaiCord runs. clang-cl, lld-link and llvm-lib pick their mode from the
          # executable name, so each is a renamed copy of the multi-call binary.
          $tools = [ordered]@{
            'clang-cl.exe' = 'clang.exe'
            'lld-link.exe' = 'lld.exe'
            'llvm-lib.exe' = 'llvm-ar.exe'
          }
          foreach ($tool in $tools.GetEnumerator()) {
            Copy-Item -LiteralPath (Join-Path $build "bin\$($tool.Value)") -Destination (Join-Path $bin $tool.Key)
          }
          # clang's resource headers for x86-64 Windows: the freestanding C headers, the x86
          # intrinsics, and the intrin.h/vadefs.h wrappers over the MSVC headers.
          foreach ($component in 'core', 'x86', 'windows', 'utility') {
            cmake --install $build --prefix $stage --component "$component-resource-headers"
            if ($LASTEXITCODE -ne 0) { throw "Installing the $component resource headers failed with exit code $LASTEXITCODE." }
          }
          $include = @(Get-ChildItem -Path (Join-Path $stage 'lib\clang\*\include') -Directory)
          if ($include.Count -ne 1) { throw "Expected one clang resource include directory, found $($include.Count)." }
          Copy-Item -LiteralPath 'llvm\LICENSE.TXT' -Destination (Join-Path $stage 'LICENSE.TXT')
          foreach ($project in 'llvm', 'clang', 'lld') {
            $dir = New-Item -ItemType Directory -Force -Path (Join-Path $stage "licenses\$project")
            Copy-Item -LiteralPath "$project\LICENSE.TXT" -Destination $dir
          }

          # The packaged tools compile against the SDK headers, archive and link.
          $smoke = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'smoke')
          $source = Join-Path $smoke 'smoke.c'
          Set-Content -LiteralPath $source -Value @(
            '#include <intrin.h>',
            '#include <immintrin.h>',
            '#include <stddef.h>',
            '#include <stdio.h>',
            'int main(void) { int info[4]; __cpuid(info, 0); __m128i v = _mm_set1_epi32(info[0]); printf("%d\n", _mm_cvtsi128_si32(v) == info[0]); return 0; }')
          & (Join-Path $bin 'clang-cl.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'The packaged clang-cl does not run.' }
          & (Join-Path $bin 'clang-cl.exe') /nologo /O2 /c $source "/Fo$smoke\smoke.obj"
          if ($LASTEXITCODE -ne 0) { throw 'The packaged clang-cl cannot compile against the SDK headers.' }
          & (Join-Path $bin 'llvm-lib.exe') /nologo "/out:$smoke\smoke.lib" "$smoke\smoke.obj"
          if ($LASTEXITCODE -ne 0) { throw 'The packaged llvm-lib failed.' }
          & (Join-Path $bin 'lld-link.exe') /nologo /subsystem:console "/out:$smoke\smoke.exe" "$smoke\smoke.lib" /include:main
          if ($LASTEXITCODE -ne 0) { throw 'The packaged lld-link failed.' }
          $result = & "$smoke\smoke.exe"
          if ($LASTEXITCODE -ne 0 -or $result -ne '1') { throw "The smoke test printed '$result' (exit code $LASTEXITCODE)." }

          $zip = Join-Path $env:GITHUB_WORKSPACE $env:ASSET
          # 7-Zip writes portable '/' entry separators; Expand-Archive and unzip both read them.
          7z a -tzip -mx=9 $zip (Join-Path $stage '*')
          if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE." }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$zip.sha256", $hash)
          Write-Host "$env:ASSET SHA-256: $hash"

      - name: Upload the toolchain
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llvm-pe-x86_64-windows
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          compression-level: 0
          retention-days: 7

      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Windows x86-64 clang-cl/lld-link/llvm-lib toolchain built from $env:GITHUB_REPOSITORY@$env:GITHUB_SHA (X86 target, Release, static MSVC runtime, rpmalloc allocator, /GS-, ThinLTO) by clang-cl from $env:BOOTSTRAP_TAG."
          gh release create $env:GITHUB_REF_NAME $env:ASSET "$env:ASSET.sha256" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $env:GITHUB_REF_NAME `
            --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE." }
