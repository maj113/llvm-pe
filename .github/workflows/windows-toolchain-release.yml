# Builds the x86-64 Windows toolchain MaiCord uses (clang-cl, lld-link and
# llvm-lib with clang's core, x86 and Windows resource headers) from this fork.
# A toolchain-* tag push publishes it as a GitHub release. A manual run builds
# the chosen host-compiler variant at the dispatched commit and uploads it as a
# workflow artifact instead, so variants can be measured without a release.
name: Windows toolchain release

on:
  push:
    tags:
      - 'toolchain-*'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Host compiler: clang-cl from the bootstrap release (ThinLTO, full LTO or no LTO) or MSVC'
        type: choice
        options:
          - clang-thinlto
          - clang-fulllto
          - clang
          - msvc
        default: clang-thinlto
      allocator:
        description: 'Heap allocator linked into the tools'
        type: choice
        options:
          - rpmalloc
          - crt
        default: rpmalloc
      security_cookies:
        description: 'Stack buffer security cookies (/GS) in the tools; off is smaller and faster'
        type: choice
        options:
          - 'off'
          - 'on'
        default: 'off'

permissions:
  contents: read

concurrency:
  group: windows-toolchain-release-${{ github.ref_name }}-${{ inputs.variant }}-${{ inputs.allocator }}-${{ inputs.security_cookies }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ inputs.variant || 'clang-thinlto' }}, ${{ inputs.allocator || 'rpmalloc' }}, /GS ${{ inputs.security_cookies || 'off' }})
    if: github.repository == 'maj113/llvm-pe'
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: write # gh release create
    env:
      VARIANT: ${{ inputs.variant || 'clang-thinlto' }}
      ALLOCATOR: ${{ inputs.allocator || 'rpmalloc' }}
      SECURITY_COOKIES: ${{ inputs.security_cookies || 'off' }}
      ASSET: llvm-pe-x86_64-windows.zip
      # The clang-cl variants build with this earlier release of the fork, not the runner's LLVM.
      BOOTSTRAP_TAG: toolchain-2026.10.28.1
      BOOTSTRAP_SHA256: a683a8eb953bf3b360670be708b53bc8a32e249a7eca8d697c1be475d0b06d5d
    steps:
      - name: Validate tag
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^toolchain-[0-9A-Za-z._-]+$') {
            throw "Release tag '$env:GITHUB_REF_NAME' must look like toolchain-YYYY.MM.DD."
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            cmake
            clang
            compiler-rt
            libc
            lld
            llvm
            third-party

      - name: Enter the MSVC x64 developer environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'No Visual Studio installation with the x64 C++ tools.' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $lines = & cmd.exe /d /c "`"$vcvars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed with exit code $LASTEXITCODE." }
          foreach ($line in $lines) {
            $name, $value = $line -split '=', 2
            if ($value -and $name -notmatch '^(GITHUB_|RUNNER_)') {
              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

      - name: Fetch the bootstrap toolchain
        if: env.VARIANT != 'msvc'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'bootstrap-download'
          gh release download $env:BOOTSTRAP_TAG --repo $env:GITHUB_REPOSITORY --pattern $env:ASSET --dir $download
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed with exit code $LASTEXITCODE." }
          $archive = Join-Path $download $env:ASSET
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($hash -ne $env:BOOTSTRAP_SHA256.ToUpperInvariant()) {
            throw "$env:ASSET from $env:BOOTSTRAP_TAG hashes to $hash, not $env:BOOTSTRAP_SHA256."
          }
          $root = Join-Path $env:RUNNER_TEMP 'bootstrap'
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $bin = Join-Path $root 'bin'
          & (Join-Path $bin 'clang-cl.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'The bootstrap clang-cl does not run.' }
          "HOST_LLVM_BIN=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        shell: pwsh
        run: |
          ninja --version
          cmake --version | Select-Object -First 1
          $options = @(
            '-DCMAKE_BUILD_TYPE=Release',
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded',
            '-DLLVM_ENABLE_PROJECTS=clang;lld',
            '-DLLVM_TARGETS_TO_BUILD=X86',
            '-DLLVM_ENABLE_ASSERTIONS=OFF',
            '-DLLVM_INCLUDE_TESTS=OFF',
            '-DLLVM_INCLUDE_BENCHMARKS=OFF',
            '-DLLVM_INCLUDE_EXAMPLES=OFF',
            '-DLLVM_INCLUDE_DOCS=OFF',
            '-DCLANG_INCLUDE_TESTS=OFF',
            '-DCLANG_INCLUDE_DOCS=OFF',
            '-DCLANG_ENABLE_CIR=OFF',
            '-DCLANG_ENABLE_STATIC_ANALYZER=OFF',
            '-DCLANG_ENABLE_OBJC_REWRITER=OFF',
            '-DLLD_ENABLE_ELF=OFF',
            '-DLLD_ENABLE_MACHO=OFF',
            '-DLLD_ENABLE_MINGW=OFF',
            '-DLLD_ENABLE_WASM=OFF',
            '-DLLVM_ENABLE_DIA_SDK=OFF',
            '-DLLVM_ENABLE_LIBXML2=OFF',
            '-DLLVM_ENABLE_ZLIB=OFF',
            '-DLLVM_ENABLE_ZSTD=OFF')
          if ($env:VARIANT -eq 'msvc') {
            $cl = (Get-Command cl.exe).Source
            $compiler = "MSVC $([Diagnostics.FileVersionInfo]::GetVersionInfo($cl).ProductVersion) ($cl)"
            $options += '-DCMAKE_C_COMPILER=cl', '-DCMAKE_CXX_COMPILER=cl'
          } else {
            $clang = Join-Path $env:HOST_LLVM_BIN 'clang-cl.exe'
            $compiler = (& $clang --version | Out-String).Split("`n")[0].Trim()
            # Visual Studio's mt, not an llvm-mt the runner image may have on PATH.
            $options += "-DCMAKE_C_COMPILER=$clang", "-DCMAKE_CXX_COMPILER=$clang",
              "-DCMAKE_LINKER=$(Join-Path $env:HOST_LLVM_BIN 'lld-link.exe')",
              "-DCMAKE_AR=$(Join-Path $env:HOST_LLVM_BIN 'llvm-lib.exe')",
              "-DCMAKE_MT=$((Get-Command mt.exe).Source)"
          }
          "HOST_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Two concurrent LTO links of clang and lld need more memory than a runner has.
          switch ($env:VARIANT) {
            'clang-thinlto' { $options += '-DLLVM_ENABLE_LTO=Thin', '-DLLVM_PARALLEL_LINK_JOBS=2' }
            'clang-fulllto' { $options += '-DLLVM_ENABLE_LTO=Full', '-DLLVM_PARALLEL_LINK_JOBS=1' }
            default { $options += '-DLLVM_PARALLEL_LINK_JOBS=2' }
          }
          if ($env:ALLOCATOR -eq 'rpmalloc') { $options += '-DLLVM_ENABLE_RPMALLOC=ON' }
          # CMake prepends CFLAGS/CXXFLAGS to its default CMAKE_C_FLAGS/CMAKE_CXX_FLAGS, which
          # every compile uses. Stack protection is a per-function attribute in the bitcode, so
          # the LTO links follow it too.
          if ($env:SECURITY_COOKIES -eq 'off') { $env:CFLAGS = '/GS-'; $env:CXXFLAGS = '/GS-' }
          $timer = [Diagnostics.Stopwatch]::StartNew()
          cmake -G Ninja -S llvm -B build @options
          if ($LASTEXITCODE -ne 0) { throw "cmake failed with exit code $LASTEXITCODE." }
          "CONFIGURE_SECONDS=$([int]$timer.Elapsed.TotalSeconds)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Select-String -LiteralPath 'build\CMakeCache.txt' -Pattern '^CMAKE_(C|CXX)_FLAGS(_RELEASE)?:' | ForEach-Object { $_.Line }

      - name: Build
        shell: pwsh
        run: |
          $processors = [Environment]::ProcessorCount
          $memory = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB, 1)
          $jobs = $processors + 2 # ninja's default
          Write-Host "$((Get-CimInstance Win32_Processor | Select-Object -First 1).Name.Trim()), $processors logical processors, $memory GiB, ninja -j $jobs"
          $timer = [Diagnostics.Stopwatch]::StartNew()
          ninja -C build -j $jobs clang lld llvm-ar
          if ($LASTEXITCODE -ne 0) { throw "ninja failed with exit code $LASTEXITCODE." }
          $seconds = [int]$timer.Elapsed.TotalSeconds
          # The final links, from the ninja log (start and end milliseconds per output).
          $links = foreach ($line in (Get-Content -LiteralPath 'build\.ninja_log' | Select-Object -Skip 1)) {
            $start, $end, $null, $output, $null = $line -split "`t"
            if ($output -match '^bin[\\/](clang|lld|llvm-ar)\.exe$') { "$output $([int](([long]$end - [long]$start) / 1000)) s" }
          }
          $summary = @(
            "### $env:VARIANT, $env:ALLOCATOR, /GS $env:SECURITY_COOKIES",
            "- Host compiler: $env:HOST_COMPILER",
            "- Runner: $env:ImageOS $env:ImageVersion, $processors logical processors, $memory GiB, ninja -j $jobs",
            "- Configure: $env:CONFIGURE_SECONDS s; build: $seconds s",
            "- Final links: $($links -join '; ')")
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          $summary | Out-File -FilePath (Join-Path $env:GITHUB_WORKSPACE 'build-times.md') -Encoding utf8
          $summary | Write-Host

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $build = Join-Path $env:GITHUB_WORKSPACE 'build'
          $stage = Join-Path $env:RUNNER_TEMP 'llvm-pe'
          $bin = New-Item -ItemType Directory -Force -Path (Join-Path $stage 'bin')
          # Only what MaiCord runs. clang-cl, lld-link and llvm-lib pick their mode from the
          # executable name, so each is a renamed copy of the multi-call binary.
          $tools = [ordered]@{
            'clang-cl.exe' = 'clang.exe'
            'lld-link.exe' = 'lld.exe'
            'llvm-lib.exe' = 'llvm-ar.exe'
          }
          foreach ($tool in $tools.GetEnumerator()) {
            Copy-Item -LiteralPath (Join-Path $build "bin\$($tool.Value)") -Destination (Join-Path $bin $tool.Key)
          }
          # clang's resource headers for x86-64 Windows: the freestanding C headers, the x86
          # intrinsics, and the intrin.h/vadefs.h wrappers over the MSVC headers.
          foreach ($component in 'core', 'x86', 'windows', 'utility') {
            cmake --install $build --prefix $stage --component "$component-resource-headers"
            if ($LASTEXITCODE -ne 0) { throw "Installing the $component resource headers failed with exit code $LASTEXITCODE." }
          }
          $include = @(Get-ChildItem -Path (Join-Path $stage 'lib\clang\*\include') -Directory)
          if ($include.Count -ne 1) { throw "Expected one clang resource include directory, found $($include.Count)." }
          Copy-Item -LiteralPath 'llvm\LICENSE.TXT' -Destination (Join-Path $stage 'LICENSE.TXT')
          foreach ($project in 'llvm', 'clang', 'lld') {
            $dir = New-Item -ItemType Directory -Force -Path (Join-Path $stage "licenses\$project")
            Copy-Item -LiteralPath "$project\LICENSE.TXT" -Destination $dir
          }

          # The packaged tools compile against the SDK headers, archive and link.
          $smoke = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'smoke')
          $source = Join-Path $smoke 'smoke.c'
          Set-Content -LiteralPath $source -Value @(
            '#include <intrin.h>',
            '#include <immintrin.h>',
            '#include <stddef.h>',
            '#include <stdio.h>',
            'int main(void) { int info[4]; __cpuid(info, 0); __m128i v = _mm_set1_epi32(info[0]); printf("%d\n", _mm_cvtsi128_si32(v) == info[0]); return 0; }')
          & (Join-Path $bin 'clang-cl.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'The packaged clang-cl does not run.' }
          & (Join-Path $bin 'clang-cl.exe') /nologo /O2 /c $source "/Fo$smoke\smoke.obj"
          if ($LASTEXITCODE -ne 0) { throw 'The packaged clang-cl cannot compile against the SDK headers.' }
          & (Join-Path $bin 'llvm-lib.exe') /nologo "/out:$smoke\smoke.lib" "$smoke\smoke.obj"
          if ($LASTEXITCODE -ne 0) { throw 'The packaged llvm-lib failed.' }
          & (Join-Path $bin 'lld-link.exe') /nologo /subsystem:console "/out:$smoke\smoke.exe" "$smoke\smoke.lib" /include:main
          if ($LASTEXITCODE -ne 0) { throw 'The packaged lld-link failed.' }
          $result = & "$smoke\smoke.exe"
          if ($LASTEXITCODE -ne 0 -or $result -ne '1') { throw "The smoke test printed '$result' (exit code $LASTEXITCODE)." }

          $zip = Join-Path $env:GITHUB_WORKSPACE $env:ASSET
          # 7-Zip writes portable '/' entry separators; Expand-Archive and unzip both read them.
          7z a -tzip -mx=9 $zip (Join-Path $stage '*')
          if ($LASTEXITCODE -ne 0) { throw "7z failed with exit code $LASTEXITCODE." }
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$zip.sha256", $hash)
          Write-Host "$env:ASSET SHA-256: $hash"

      - name: Upload the measurement build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llvm-pe-${{ env.VARIANT }}-${{ env.ALLOCATOR }}-gs-${{ env.SECURITY_COOKIES }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
            build-times.md
            build/.ninja_log
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Windows x86-64 clang-cl/lld-link/llvm-lib toolchain built from $env:GITHUB_REPOSITORY@$env:GITHUB_SHA (X86 target, Release, static MSVC runtime, $env:ALLOCATOR allocator, /GS $env:SECURITY_COOKIES) by $env:HOST_COMPILER."
          gh release create $env:GITHUB_REF_NAME $env:ASSET "$env:ASSET.sha256" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title $env:GITHUB_REF_NAME `
            --notes $notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE." }
